<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <title>Account Settings — Antigravity</title>
  <style>
    :root { --bg:#090d16; --card-bg:rgba(18,24,38,0.92); --card-border:rgba(255,255,255,0.08); --text-main:#f3f4f6; --text-muted:#9ca3af; --primary:#6366f1; --primary-hover:#4f46e5; --danger:#ef4444; --danger-bg:rgba(239,68,68,0.12); --success:#10b981; --radius-lg:16px; --radius-md:10px; }
    * { box-sizing:border-box; margin:0; padding:0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; }
    body { background:var(--bg); background-image:radial-gradient(at 0% 0%, rgba(99,102,241,0.15) 0px, transparent 50%); color:var(--text-main); min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px 16px; }
    .container { width:100%; max-width:480px; }
    .nav-bar { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; }
    .back-link { display:inline-flex; align-items:center; gap:6px; color:var(--text-muted); font-size:0.85rem; text-decoration:none; padding:6px 12px; border-radius:9999px; border:1px solid rgba(255,255,255,0.08); transition:all 0.15s; }
    .back-link:hover { color:#fff; background:rgba(255,255,255,0.05); }
    .logout-btn { display:inline-flex; align-items:center; gap:6px; padding:6px 12px; border-radius:9999px; font-size:0.8rem; font-weight:600; cursor:pointer; border:1px solid rgba(239,68,68,0.2); background:rgba(239,68,68,0.07); color:#f87171; transition:all 0.15s; }
    .logout-btn:hover { background:rgba(239,68,68,0.15); }
    .header { text-align:center; margin-bottom:24px; }
    .title { font-size:1.6rem; font-weight:800; background:linear-gradient(135deg,#fff 40%,#cbd5e1 100%); -webkit-background-clip:text; -webkit-text-fill-color:transparent; margin-bottom:6px; }
    .subtitle { color:var(--text-muted); font-size:0.88rem; }
    .card { background:var(--card-bg); border:1px solid var(--card-border); border-radius:var(--radius-lg); padding:24px; backdrop-filter:blur(16px); box-shadow:0 20px 40px -15px rgba(0,0,0,0.5); margin-bottom:16px; }
    .card h2 { font-size:1rem; font-weight:700; margin-bottom:16px; padding-bottom:12px; border-bottom:1px solid var(--card-border); }
    .form-group { margin-bottom:14px; }
    .form-label { display:block; font-size:0.82rem; font-weight:600; color:var(--text-muted); margin-bottom:5px; }
    .input-field { width:100%; background:rgba(10,14,23,0.85); border:1px solid rgba(255,255,255,0.12); border-radius:var(--radius-md); color:#fff; font-size:0.92rem; padding:12px 14px; outline:none; transition:all 0.2s; }
    .input-field:focus { border-color:var(--primary); box-shadow:0 0 0 3px rgba(99,102,241,0.25); }
    .input-field:disabled { opacity:0.5; cursor:not-allowed; }
    .btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; width:100%; padding:13px 18px; border-radius:var(--radius-md); font-size:0.92rem; font-weight:600; cursor:pointer; border:none; color:#fff; background:var(--primary); transition:all 0.2s; margin-top:4px; }
    .btn:hover:not(:disabled) { background:var(--primary-hover); }
    .btn:disabled { opacity:0.65; cursor:not-allowed; }
    .spinner { width:16px; height:16px; border:2px solid rgba(255,255,255,0.3); border-top-color:#fff; border-radius:50%; animation:spin 0.7s linear infinite; }
    @keyframes spin { to { transform:rotate(360deg); } }
    .alert { display:none; padding:12px 14px; border-radius:var(--radius-md); font-size:0.88rem; margin-top:12px; }
    .alert.active { display:block; }
    .alert-error { background:var(--danger-bg); border:1px solid rgba(239,68,68,0.25); color:#fca5a5; }
    .alert-success { background:rgba(16,185,129,0.1); border:1px solid rgba(16,185,129,0.25); color:#6ee7b7; }
  </style>
</head>
<body>
  <div class="container">
    <div class="nav-bar">
      <a href="/user" class="back-link">← Back to Downloader</a>
      <button class="logout-btn" onclick="logout()">🚪 Logout</button>
    </div>
    <div class="header">
      <h1 class="title">Account Settings</h1>
      <p class="subtitle">Update your email or password. Current password is always required.</p>
    </div>

    <div class="card">
      <h2>Current Account</h2>
      <div class="form-group">
        <label class="form-label">Email</label>
        <input id="currentEmail" class="input-field" type="text" disabled />
      </div>
    </div>

    <div class="card">
      <h2>Change Email</h2>
      <form id="emailForm">
        <div class="form-group"><label class="form-label">New Email</label><input id="newEmail" class="input-field" type="email" placeholder="new@example.com" required /></div>
        <div class="form-group"><label class="form-label">Current Password (required)</label><input id="emailCurrentPw" class="input-field" type="password" placeholder="Your current password" required /></div>
        <button type="submit" class="btn" id="emailBtn"><span id="emailSpinner" class="spinner" style="display:none;"></span><span id="emailBtnText">Change Email</span></button>
        <div id="emailAlert" class="alert"></div>
      </form>
    </div>

    <div class="card">
      <h2>Change Password</h2>
      <form id="passwordForm">
        <div class="form-group"><label class="form-label">Current Password</label><input id="currentPw" class="input-field" type="password" placeholder="Your current password" required /></div>
        <div class="form-group"><label class="form-label">New Password</label><input id="newPw" class="input-field" type="password" placeholder="Min 8 chars, upper+lower+digit+special" required /></div>
        <div class="form-group"><label class="form-label">Confirm New Password</label><input id="confirmPw" class="input-field" type="password" placeholder="Repeat new password" required /></div>
        <button type="submit" class="btn" id="pwBtn"><span id="pwSpinner" class="spinner" style="display:none;"></span><span id="pwBtnText">Change Password</span></button>
        <div id="pwAlert" class="alert"></div>
      </form>
    </div>
  </div>

  <script>
    let currentUser = null;

    async function apiJson(url, method = 'GET', body = null) {
      const opts = { method, credentials: 'include', headers: {} };
      if (body) { opts.headers['Content-Type'] = 'application/json'; opts.body = JSON.stringify(body); }
      const r = await fetch(url, opts);
      if (r.status === 401) { window.location.replace('/login'); throw new Error('Not authenticated'); }
      const d = await r.json();
      if (!r.ok) throw new Error(d.error || 'Request failed');
      return d;
    }

    async function init() {
      try {
        const me = await apiJson('/api/auth/me');
        if (!me.authenticated) { window.location.replace('/login'); return; }
        currentUser = me;
        document.getElementById('currentEmail').value = me.email;
      } catch (_) {}
    }

    async function logout() {
      await fetch('/api/auth/logout', { method: 'POST', credentials: 'include' });
      window.location.replace('/login');
    }

    document.getElementById('emailForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const alert = document.getElementById('emailAlert');
      const btn = document.getElementById('emailBtn');
      alert.className = 'alert';
      btn.disabled = true; document.getElementById('emailSpinner').style.display = 'inline-block';
      document.getElementById('emailBtnText').textContent = 'Updating...';
      try {
        await apiJson('/api/user/settings', 'PUT', {
          currentPassword: document.getElementById('emailCurrentPw').value,
          newEmail: document.getElementById('newEmail').value.trim(),
        });
        alert.textContent = 'Email updated successfully.';
        alert.classList.add('active', 'alert-success');
        document.getElementById('currentEmail').value = document.getElementById('newEmail').value.trim();
        document.getElementById('emailForm').reset();
      } catch (err) { alert.textContent = err.message; alert.classList.add('active', 'alert-error'); }
      finally { btn.disabled = false; document.getElementById('emailSpinner').style.display = 'none'; document.getElementById('emailBtnText').textContent = 'Change Email'; }
    });

    document.getElementById('passwordForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const alert = document.getElementById('pwAlert');
      const btn = document.getElementById('pwBtn');
      alert.className = 'alert';
      btn.disabled = true; document.getElementById('pwSpinner').style.display = 'inline-block';
      document.getElementById('pwBtnText').textContent = 'Updating...';
      try {
        const d = await apiJson('/api/user/settings', 'PUT', {
          currentPassword: document.getElementById('currentPw').value,
          newPassword: document.getElementById('newPw').value,
          confirmPassword: document.getElementById('confirmPw').value,
        });
        if (d.sessionInvalidated) {
          alert.textContent = 'Password changed. Redirecting to login...';
          alert.classList.add('active', 'alert-success');
          setTimeout(() => window.location.replace('/login'), 1500);
        }
      } catch (err) { alert.textContent = err.message; alert.classList.add('active', 'alert-error'); }
      finally { btn.disabled = false; document.getElementById('pwSpinner').style.display = 'none'; document.getElementById('pwBtnText').textContent = 'Change Password'; }
    });

    init();
  </script>
</body>
</html>
