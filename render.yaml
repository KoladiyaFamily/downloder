services:
  - type: web
    name: downloader
    runtime: node
    plan: free
    region: oregon
    # Build: npm install + create /opt/venv + install yt-dlp into the venv.
    # /opt/venv/bin/python is the ONLY interpreter server.js will call for yt-dlp.
    # Both verification steps must pass or the build fails before deployment.
    buildCommand: >-
      npm install &&
      python3 -m venv /opt/venv &&
      /opt/venv/bin/python -m pip install --no-cache-dir -U yt-dlp curl-cffi opencv-python-headless numpy pillow &&
      /opt/venv/bin/python -m yt_dlp --version &&
      /opt/venv/bin/python -c "import yt_dlp, cv2, numpy, PIL; print('Imports OK: yt-dlp', yt_dlp.version.__version__, 'cv2', cv2.__version__)"
    startCommand: node server.js
    autoDeploy: true
    disk:
      name: downloader-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: USER_EMAIL
        sync: false
      - key: USER_PASSWORD
        sync: false
